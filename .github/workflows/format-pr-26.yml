name: Format PR 26

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 26
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files
        run: npx prettier --write src/admin/MaterialsDrive.tsx src/lg/parentWorkflows.jsx src/lg/studentPortal.jsx

      - name: Push formatted files
        run: |
          if git diff --quiet -- src/admin/MaterialsDrive.tsx src/lg/parentWorkflows.jsx src/lg/studentPortal.jsx; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/MaterialsDrive.tsx src/lg/parentWorkflows.jsx src/lg/studentPortal.jsx
          git commit -m "style: format study material portal files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
