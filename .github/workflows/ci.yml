name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format StudentAppFixed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/lg/StudentAppFixed.jsx
          if ! git diff --quiet -- src/lg/StudentAppFixed.jsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lg/StudentAppFixed.jsx
            git commit -m "style: format StudentAppFixed"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Lint changed source files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="HEAD^"
            fi
          fi

          git fetch origin main --depth=1 || true
          mapfile -t FILES < <(git diff --name-only "$BASE_SHA" HEAD -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' \
            ':!package-lock.json' ':!.github/workflows/*')

          if (( ${#FILES[@]} == 0 )); then
            echo "No changed files require Prettier validation."
          else
            printf 'Checking %s changed file(s) with Prettier:\n' "${#FILES[@]}"
            printf ' - %s\n' "${FILES[@]}"
            npx prettier --check "${FILES[@]}"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
