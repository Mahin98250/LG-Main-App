name: Enforce default account passwords

on:
  push:
    branches: [main]
    paths:
      - 'src/admin/records/AdminRecordsPage.tsx'

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply required defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/admin/records/AdminRecordsPage.tsx')
          s = p.read_text()
          original = s
          s = s.replace('const PASSWORD_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";\nconst generateTemporaryPassword = () => {\n  const bytes = new Uint32Array(14);\n  crypto.getRandomValues(bytes);\n  return Array.from(bytes, (value) => PASSWORD_CHARS[value % PASSWORD_CHARS.length]).join("");\n};', 'const DEFAULT_STUDENT_PASSWORD = "Student@1234";\nconst DEFAULT_PARENT_PASSWORD = "Parent@1234";\nconst DEFAULT_TEACHER_PASSWORD = "Teacher@1234";')
          s = s.replace('password: generateTemporaryPassword(), parentPassword: generateTemporaryPassword()', 'password: DEFAULT_STUDENT_PASSWORD, parentPassword: DEFAULT_PARENT_PASSWORD')
          s = s.replace('password: generateTemporaryPassword(), parentPassword: ""', 'password: DEFAULT_TEACHER_PASSWORD, parentPassword: ""')
          s = s.replace('The parent receives a separate randomly generated temporary password.', 'The parent starts with the default password Parent@1234 and can change it after login.')
          s = s.replace('A random temporary password is generated for new accounts. Minimum 8 characters.', 'Default password: Student@1234. The account holder can change it after login.')
          s = s.replace('A separate random temporary password is generated for the parent account.', 'Default password: Parent@1234. The parent can change it after login.')
          s = s.replace('A random temporary password is generated for new accounts. Minimum 8 characters.', 'Default password: Teacher@1234. The teacher can change it after login.', 1)
          if s == original:
              print('No source change required.')
          else:
              p.write_text(s)
          PY
      - name: Verify defaults and remove one-shot workflow
        shell: bash
        run: |
          grep -q 'DEFAULT_STUDENT_PASSWORD = "Student@1234"' src/admin/records/AdminRecordsPage.tsx
          grep -q 'DEFAULT_PARENT_PASSWORD = "Parent@1234"' src/admin/records/AdminRecordsPage.tsx
          ! grep -q 'generateTemporaryPassword' src/admin/records/AdminRecordsPage.tsx
          rm -f .github/workflows/enforce-default-passwords.yml
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/records/AdminRecordsPage.tsx .github/workflows/enforce-default-passwords.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use fixed default passwords for student and parent accounts'
          git push