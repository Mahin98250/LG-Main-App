name: One-time TypeScript repair

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply exact TypeScript fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'src/admin/MaterialsDrive.tsx': [
                  (
                      'const subject = current && current.parent_id === sectionFolder.id ? current.name : "";',
                      'const activeFolder = current;\n      const subject = activeFolder && activeFolder.parent_id === sectionFolder.id ? activeFolder.name : "";'
                  ),
                  ('folder_id: current.id,', 'folder_id: activeFolder.id,'),
              ],
              'src/admin/ReferenceAdminPanel.tsx': [
                  ('(r: Row) => ReactNode?', '(r: Row) => ReactNode'),
                  ('String(s.name || "?")[0]', 'String(s.name || "?").charAt(0)'),
              ],
              'src/admin/dashboard/AdminDashboard.tsx': [
                  ('(s.name || "?")[0].toUpperCase()', '(s.name || "?").charAt(0).toUpperCase()'),
              ],
              'src/routes/app.tsx': [
                  ('<PushNotificationPrompt />', '<PushNotificationPrompt user={user} />'),
              ],
              'src/lg/authscreens.tsx': [
                  ('type Role = "teacher" | "student" | "parent";', 'export type Role = "teacher" | "student" | "parent";'),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(filename)

          if not changed:
              raise SystemExit('No source changes were made; refusing to create a meaningless commit.')
          print('Fixed:', ', '.join(changed))
      - name: Verify TypeScript
        run: |
          npm install
          npm run typecheck
      - name: Commit fixes and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-ts-fix.yml
          git add src/admin/MaterialsDrive.tsx src/admin/ReferenceAdminPanel.tsx src/admin/dashboard/AdminDashboard.tsx src/routes/app.tsx src/lg/authscreens.tsx
          git commit -m 'fix: repair remaining TypeScript errors'
          git push origin HEAD:main
