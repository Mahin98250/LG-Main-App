name: One-time TypeScript repair

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'ci: trigger one-time TypeScript repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply TypeScript fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          changes = {}

          def replace_once(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count == 0:
                  raise SystemExit(f'Expected pattern not found in {path}: {pattern}')
              p.write_text(new, encoding='utf-8')
              changes[path] = changes.get(path, 0) + count

          replace_once('src/admin/MaterialsDrive.tsx', r'const subject = current && current\.parent_id === sectionFolder\.id \? current\.name : "";', 'const activeFolder = current;\\n      const subject = activeFolder && activeFolder.parent_id === sectionFolder.id ? activeFolder.name : "";')
          p = Path('src/admin/MaterialsDrive.tsx')
          text = p.read_text(encoding='utf-8')
          text2, count = re.subn(r'folder_id: current\.id,', 'folder_id: activeFolder.id,', text, count=1)
          if count:
              p.write_text(text2, encoding='utf-8')
              changes['src/admin/MaterialsDrive.tsx'] = changes.get('src/admin/MaterialsDrive.tsx', 0) + count

          replace_once('src/admin/ReferenceAdminPanel.tsx', r'\(r: Row\) => ReactNode\?', '(r: Row) => ReactNode')
          replace_once('src/admin/ReferenceAdminPanel.tsx', r'String\(s\.name \|\| "\?"\)\[0\]', 'String(s.name || "?").charAt(0)')
          replace_once('src/admin/dashboard/AdminDashboard.tsx', r'\(s\.name \|\| "\?"\)\[0\]\.toUpperCase\(\)', '(s.name || "?").charAt(0).toUpperCase()')
          replace_once('src/routes/app.tsx', r'<PushNotificationPrompt />', '<PushNotificationPrompt user={user} />')
          replace_once('src/lg/authscreens.tsx', r'(?m)^type Role = "teacher" \| "student" \| "parent";$', 'export type Role = "teacher" | "student" | "parent";')

          print('Fixed:', changes)
      - name: Verify TypeScript
        run: |
          npm install
          npm run typecheck
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-ts-fix.yml
          git add src/admin/MaterialsDrive.tsx src/admin/ReferenceAdminPanel.tsx src/admin/dashboard/AdminDashboard.tsx src/routes/app.tsx src/lg/authscreens.tsx
          git commit -m 'fix: resolve strict TypeScript errors'
          git push origin HEAD:main
