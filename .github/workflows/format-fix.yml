name: One-time Prettier Fix

on:
  push:
    branches:
      - fix/hooks-load-deps

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/hooks-load-deps

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format reported files
        run: npx prettier --write src/routes/app.tsx src/admin/dashboard/AdminDashboard.tsx src/lg/data.js src/lg/supabase.ts src/routes/__root.tsx src/routes/admin.tsx src/routes/auth.tsx src/routes/index.tsx

      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add src/routes/app.tsx src/admin/dashboard/AdminDashboard.tsx src/lg/data.js src/lg/supabase.ts src/routes/__root.tsx src/routes/admin.tsx src/routes/auth.tsx src/routes/index.tsx
          git commit -m "chore: apply Prettier formatting fixes"
          git push origin fix/hooks-load-deps
