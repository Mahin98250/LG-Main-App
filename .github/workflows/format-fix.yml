name: Format repaired source files

on:
  push:
    branches: [fix/typescript-cleanup]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Format source files
        run: npx prettier --write src/admin/MaterialsDrive.tsx src/admin/ReferenceAdminPanel.tsx src/admin/dashboard/AdminDashboard.tsx src/lg/authscreens.tsx src/routes/app.tsx
      - name: Commit formatting and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/MaterialsDrive.tsx src/admin/ReferenceAdminPanel.tsx src/admin/dashboard/AdminDashboard.tsx src/lg/authscreens.tsx src/routes/app.tsx
          git rm -f .github/workflows/format-fix.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format repaired source files'
          git push origin HEAD:fix/typescript-cleanup
