name: Production Performance Smoke

on:
  workflow_dispatch:
    inputs:
      users:
        description: 'Concurrent users (1-1000)'
        required: true
        default: '50'
      requests_per_user:
        description: 'Requests per user (1-20)'
        required: true
        default: '3'
  push:
    branches: [perf/load-test-production]

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        users: [50, 100, 250]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run bounded production smoke test
        env:
          TARGET_URL: https://mahin98250.github.io/LG-Main-App/
          USERS: ${{ github.event_name == 'workflow_dispatch' && inputs.users || matrix.users }}
          REQUESTS_PER_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.requests_per_user || 3 }}
          TIMEOUT_MS: 15000
        run: node scripts/performance-smoke.mjs
