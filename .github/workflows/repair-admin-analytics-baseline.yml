name: Repair Admin Analytics baseline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Patch exact TypeScript error
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/admin/AdminAnalytics.tsx')
          text = p.read_text(encoding='utf-8')
          old = 'for(let i=0;i<queries.length;i++){const query=queries[i];if(!query)continue;const r=await query;if(r.error&&!first)first=r.error.message; out[keys[i]]=r.data||[];}'
          new = 'for(let i=0;i<queries.length;i++){const query=queries[i];const key=keys[i];if(!query||!key)continue;const r=await query;if(r.error&&!first)first=r.error.message;out[key]=r.data||[];}'
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

      - name: Verify formatting and TypeScript
        run: |
          npm install
          npx prettier --write src/admin/AdminAnalytics.tsx
          npx prettier --check src/admin/AdminAnalytics.tsx
          npm run typecheck

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/AdminAnalytics.tsx
          git rm .github/workflows/repair-admin-analytics-baseline.yml
          git commit -m 'fix: resolve AdminAnalytics TypeScript index guard'
          git push origin main
