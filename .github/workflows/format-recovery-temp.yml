name: Format recovery page (temporary)

on:
  push:
    branches:
      - fix/recovery-formatting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prettier --write src/admin/RecoverySettingsPage.tsx
      - name: Commit formatted file
        run: |
          if git diff --quiet -- src/admin/RecoverySettingsPage.tsx; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/RecoverySettingsPage.tsx
          git commit -m "style: format recovery settings page"
          git push
