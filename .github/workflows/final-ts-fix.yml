name: Final TypeScript cleanup

on:
  push:
    branches: [fix/typescript-cleanup]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'ci: trigger final TypeScript cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix remaining unsafe index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/admin/ReferenceAdminPanel.tsx')
          s = p.read_text()
          old = '(s.name || "?")[0]'
          new = '(s.name || "?").charAt(0)'
          if old not in s:
              raise SystemExit('Expected remaining unsafe index was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify typecheck
        run: |
          npm install
          npm run typecheck
      - name: Commit verified source and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/ReferenceAdminPanel.tsx
          git rm -f .github/workflows/final-ts-fix.yml .github/workflows/apply-ts-fixes.yml || true
          git commit -m 'fix: complete TypeScript cleanup'
          git push origin HEAD:fix/typescript-cleanup
