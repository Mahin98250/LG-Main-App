name: Format study materials

on:
  push:
    branches:
      - feat/standard-based-material-access
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/standard-based-material-access
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format changed files
        run: npx prettier --write src/admin/MaterialsDrive.tsx src/lg/parentWorkflows.jsx src/lg/studentPortal.jsx

      - name: Commit formatted files
        run: |
          if git diff --quiet -- src/admin/MaterialsDrive.tsx src/lg/parentWorkflows.jsx src/lg/studentPortal.jsx; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/MaterialsDrive.tsx src/lg/parentWorkflows.jsx src/lg/studentPortal.jsx
          git commit -m "style: format study material portal files"
          git push origin HEAD:feat/standard-based-material-access

