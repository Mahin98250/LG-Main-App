name: Repair TypeScript baseline

on:
  push:
    branches: [fix/typescript-cleanup]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'ci: make TypeScript repair deterministic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply deterministic source fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'src/admin/MaterialsDrive.tsx': [
                  ('folder_id: current.id,', 'folder_id: current?.id ?? null,'),
              ],
              'src/admin/ReferenceAdminPanel.tsx': [
                  ('(r: Row) => ReactNode?', '(r: Row) => ReactNode'),
                  ('String(s.name || "?")[0]', 'String(s.name || "?").charAt(0)'),
                  ('(s.name || "?")[0]', '(s.name || "?").charAt(0)'),
              ],
              'src/admin/dashboard/AdminDashboard.tsx': [
                  ('(s.name || "?")[0].toUpperCase()', '(s.name || "?").charAt(0).toUpperCase()'),
              ],
              'src/routes/app.tsx': [
                  ('<PushNotificationPrompt />', '<PushNotificationPrompt user={user} />'),
              ],
              'src/lg/authscreens.tsx': [
                  ('type Role = "teacher" | "student" | "parent";', 'export type Role = "teacher" | "student" | "parent";'),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(filename)
          print('Changed:', ', '.join(changed) if changed else 'none')

      - name: Verify TypeScript
        run: |
          npm install
          npm run typecheck

      - name: Commit verified source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/MaterialsDrive.tsx src/admin/ReferenceAdminPanel.tsx src/admin/dashboard/AdminDashboard.tsx src/routes/app.tsx src/lg/authscreens.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'fix: resolve TypeScript baseline errors'
            git push origin HEAD:fix/typescript-cleanup
          fi
