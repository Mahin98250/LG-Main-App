name: One-shot TypeScript repair

on:
  push:
    branches: [fix/typescript-cleanup]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair source
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'src/admin/MaterialsDrive.tsx': [('folder_id: current.id,', 'folder_id: current?.id ?? null,')],
            'src/admin/ReferenceAdminPanel.tsx': [
              ('(r: Row) => ReactNode?', '(r: Row) => ReactNode'),
              ('String(s.name || "?")[0]', 'String(s.name || "?").charAt(0)'),
              ('(s.name || "?")[0]', '(s.name || "?").charAt(0)'),
            ],
            'src/admin/dashboard/AdminDashboard.tsx': [('(s.name || "?")[0].toUpperCase()', '(s.name || "?").charAt(0).toUpperCase()')],
            'src/routes/app.tsx': [('<PushNotificationPrompt />', '<PushNotificationPrompt user={user} />')],
            'src/lg/authscreens.tsx': [('type Role = "teacher" | "student" | "parent";', 'export type Role = "teacher" | "student" | "parent";')],
          }
          for filename, pairs in replacements.items():
            p = Path(filename)
            text = p.read_text(encoding='utf-8')
            for old, new in pairs:
              text = text.replace(old, new)
            p.write_text(text, encoding='utf-8')
      - name: Typecheck
        run: |
          npm install
          npm run typecheck
      - name: Commit source and remove repair workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/MaterialsDrive.tsx src/admin/ReferenceAdminPanel.tsx src/admin/dashboard/AdminDashboard.tsx src/routes/app.tsx src/lg/authscreens.tsx
          git rm -f .github/workflows/repair-now.yml .github/workflows/apply-ts-fixes.yml .github/workflows/final-ts-fix.yml .github/workflows/ts-final.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: resolve TypeScript baseline and retire repair workflows'
          git push origin HEAD:fix/typescript-cleanup
