name: TS final verification

on:
  push:
    branches: [fix/typescript-cleanup]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply remaining strict-index fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/admin/ReferenceAdminPanel.tsx')
          s = p.read_text()
          old = '(s.name || "?")[0]'
          new = '(s.name || "?").charAt(0)'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              print('Remaining index already fixed')
          PY
      - name: Typecheck
        run: |
          npm install
          npm run typecheck
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/ReferenceAdminPanel.tsx
          git rm -f .github/workflows/ts-final.yml .github/workflows/final-ts-fix.yml .github/workflows/apply-ts-fixes.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: complete strict TypeScript cleanup'
          git push origin HEAD:fix/typescript-cleanup
