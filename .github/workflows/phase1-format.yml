name: Phase 1 Format

on:
  push:
    branches:
      - phase1-performance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format Phase 1 file
        run: npx --yes prettier@3.6.2 --write src/lg/studentPortal.jsx

      - name: Commit formatting if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/lg/studentPortal.jsx; then
            echo "Already formatted"
            exit 0
          fi
          git add src/lg/studentPortal.jsx
          git commit -m "style: format student portal"
          git push

      - name: Remove one-time formatter
        run: |
          if [ -f .github/workflows/phase1-format.yml ]; then
            git rm .github/workflows/phase1-format.yml
            git commit -m "chore: remove one-time formatter"
            git push
          fi
