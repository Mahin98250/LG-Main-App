name: Final TypeScript index repair

on:
  push:
    branches: [fix/typescript-cleanup]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply final index fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          files = {
            'src/admin/MaterialsDrive.tsx': [(r'folder_id: current\.id,', 'folder_id: current?.id ?? null,')],
            'src/admin/ReferenceAdminPanel.tsx': [
              (r'\(r: Row\) => ReactNode\?', '(r: Row) => ReactNode'),
              (r'String\(s\.name \|\| "\?"\)\[0\]', 'String(s.name || "?").charAt(0)'),
              (r'\(s\.name \|\| "\?"\)\[0\]', '(s.name || "?").charAt(0)'),
              (r'\bx\[0\]', 'x[0] ?? ""'),
              (r'\bx\[1\]', 'x[1] ?? ""'),
              (r'\bx\[2\]', 'x[2] ?? ""'),
              (r'\[-5, 2, -2, 5, 0\]\[i\]', '[-5, 2, -2, 5, 0][i] ?? 0'),
            ],
            'src/admin/dashboard/AdminDashboard.tsx': [(r'\(s\.name \|\| "\?"\)\[0\]\.toUpperCase\(\)', '(s.name || "?").charAt(0).toUpperCase()')],
            'src/routes/app.tsx': [(r'<PushNotificationPrompt />', '<PushNotificationPrompt user={user} />')],
            'src/lg/authscreens.tsx': [(r'(?m)^type Role = "teacher" \| "student" \| "parent";$', 'export type Role = "teacher" | "student" | "parent";')],
          }
          for name, replacements in files.items():
            p = Path(name)
            s = p.read_text(encoding='utf-8')
            for pattern, replacement in replacements:
              s = re.sub(pattern, replacement, s)
            p.write_text(s, encoding='utf-8')

      - name: Verify typecheck and build
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Commit verified source and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/MaterialsDrive.tsx src/admin/ReferenceAdminPanel.tsx src/admin/dashboard/AdminDashboard.tsx src/routes/app.tsx src/lg/authscreens.tsx
          git rm -f .github/workflows/repair-final3.yml .github/workflows/repair-final2.yml .github/workflows/repair-final.yml .github/workflows/repair-now2.yml .github/workflows/repair-now.yml .github/workflows/apply-ts-fixes.yml .github/workflows/final-ts-fix.yml .github/workflows/ts-final.yml || true
          git commit -m 'fix: complete TypeScript and production build verification'
          git push origin HEAD:fix/typescript-cleanup
